# サンプルアプリの VirtualHost。ポートは PORT 環境変数（Dockerfile で既定 8080）
<VirtualHost *:${PORT}>
    ServerAdmin webmaster@localhost
    DocumentRoot /var/www/html/public

    <Directory /var/www/html/public>
        Options -Indexes
        AllowOverride None
        Require all granted
        # 実在しないパス（/update, /health など）はすべてフロントコントローラへ
        FallbackResource /index.php
    </Directory>

    # ログはファイルに書かず stdout/stderr へ出す（Cloud Logging に自動収集される）
    ErrorLog /proc/self/fd/2
    CustomLog /proc/self/fd/1 combined
</VirtualHost>
